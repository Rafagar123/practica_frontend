<div class="login-container">
    <h2>Login</h2>
    <div class="form-group">
        <label for="nickUsuario">Nick usuario:</label>
        <input type="text" id="nickUsuario" name="nickUsuario" [(ngModel)]="nickUsuario">
    </div>
    <div class="form-group">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" [(ngModel)]="contrasena">
    </div>

    <p *ngIf="mensajeError" class="errorClass"> {{ mensajeError }} </p>

    <button class="login-button" (click)="login()">Iniciar Sesion</button>
</div>
